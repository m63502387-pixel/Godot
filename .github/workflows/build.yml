name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          JAVA_DIR=$(dirname $(dirname $(readlink -f $(which javac))))
          echo "Java: $JAVA_DIR"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "/root/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_DIR" > ~/.config/godot/editor_settings-4.tres
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres
      - name: Build
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/metel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: metel-apk
          path: build/metel.apk
