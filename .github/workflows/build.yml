name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/metel.apk
      - uses: actions/upload-artifact@v4
        with:
          name: metel-apk
          path: build/metel.apk
